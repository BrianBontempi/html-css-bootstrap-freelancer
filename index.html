<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ! font awesome -->
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css' integrity='sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==' crossorigin='anonymous'/>
    <!-- ! bootstap link -->
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css' integrity='sha512-b2QcS5SsA8tZodcDtGRELiGv5SaKSk1vDHDaQRda0htPYWZ6046lr3kJ5bAAQdpV2mmA/4v0wQF9MyU6/pDIAg==' crossorigin='anonymous'/>
    <!-- ! google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <!-- ! my css -->
    <link rel="stylesheet" href="css/style.css">
    <title>Freelancer - Start Bootstrap</title>
</head>
<body>
    <!-- ! header -->
    <header class="sticky-top">
        <nav class="navbar h-100">
            <div class="container h-100 align-items-center">
                <a class="navbar-brand text-light fw-bold" href="#">START BOOTSTRAP</a>
                <button class="btn btn-outline-light d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#mobile-menu" aria-controls="mobile-menu" aria-expanded="false" aria-label="Menu"><i class="fas fa-bars"></i></button>
                <ul class="d-none d-md-flex m-0 gap-4">
                    <li><a href="#portfolio">PORTFOLIO</a></li>
                    <li><a href="#about">ABOUT</a></li>
                    <li><a href="#contact">CONTACT</a></li>
                </ul>
            </div>
        </nav>
        <!-- ! menu mobile -->
        <div class="collapse d-md-none" id="mobile-menu">
            <div class="container">
                <ul class="m-0 p-0 pb-3">
                    <li class="py-2"><a href="#portfolio">PORTFOLIO</a></li>
                    <li class="py-2"><a href="#about">ABOUT</a></li>
                    <li class="py-2"><a href="#contact">CONTACT</a></li>
                </ul>
            </div>
        </div>
    </header>
   <!-- ! spotlight -->
    <div class="spotlight text-light text-center">
        <div class="container py-5">
            <img src="img/avatar.svg" id="avatar" alt="avatar">
            <h1 class="mt-4 mb-4 fw-bold">START BOOTSTRAP</h1>
            <div class="divider mb-4">
                <i class="fas fa-star"></i>
            </div>
            <span class="d-block fs-5">Graphic Artist - Web Designer - Illustrator</span>
        </div>
    </div>
   <!-- ! primary section -->
    <section id="portfolio" class="container py-5">
        <h2 class="text-center fw-bold mt-4 mb-4">PORTFOLIO</h2>
        <div class="divider dark-divider mb-5">
            <i class="fas fa-star"></i>
        </div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3">
            <div class="col">
                <div class="portfolio-item mb-4">
                    <img src="img/cabin.png" class="img-fluid rounded" alt="cabin">
                    <div class="portfolio-hover">
                        <i class="fas fa-plus fa-3x"></i>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="portfolio-item mb-4">
                    <img src="img/cake.png" class="img-fluid rounded" alt="cake">
                    <div class="portfolio-hover">
                        <i class="fas fa-plus fa-3x"></i>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="portfolio-item mb-4">
                    <img src="img/circus.png" class="img-fluid rounded" alt="circus">
                    <div class="portfolio-hover">
                        <i class="fas fa-plus fa-3x"></i>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="portfolio-item mb-4">
                    <img src="img/game.png" class="img-fluid rounded" alt="game">
                    <div class="portfolio-hover">
                        <i class="fas fa-plus fa-3x"></i>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="portfolio-item mb-4">
                    <img src="img/safe.png" class="img-fluid rounded" alt="safe">
                    <div class="portfolio-hover">
                        <i class="fas fa-plus fa-3x"></i>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="portfolio-item mb-4">
                    <img src="img/submarine.png" class="img-fluid rounded" alt="submarine">
                    <div class="portfolio-hover">
                        <i class="fas fa-plus fa-3x"></i>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- ! abaout section -->
    <div id="about">
        <div class="container ">
            <div class="row row-cols-1 row-cols-md-2">
                <div class="col"></div>
                <div class="col"></div>
            </div>
        </div>
    </div>
    <!-- ! form section -->
    <div id="form"></div>
    <!-- ! footer -->
    <footer>
        <div class="container">
            <div class="row row-cols-1 row-cols-md-3">
                <div class="col"></div>
                <div class="col"></div>
                <div class="col"></div>
            </div>
        </div>
    </footer>
    <!-- ! bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
